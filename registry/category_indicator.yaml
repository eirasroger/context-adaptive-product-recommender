- category_key: concrete
  indicator_key: compressive_strength
  is_required: 0
  relevance_mode: context_declared
  direction_override: null
  control_mode: exclude
  control_note: Higher is better only up to the point where the structural requirement is met, and every alternative reaching a comparison is assumed already adequate. A monotone sweep across the full range would assert that strength keeps buying preference indefinitely, which the indicator's own definition denies. Revisit if an adequacy threshold is ever declared, which would make an ideal-band sweep meaningful.
  note: null
