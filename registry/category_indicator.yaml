- category_key: concrete
  indicator_key: cement_content
  is_required: 0
  relevance_mode: context_declared
  direction_override: null
  control_mode: exclude
  control_note: The sources disagree. Higher content supports durability and strength while raising impact and cost, and which side dominates is an open question, so the declared direction is not safe to assert across the whole range. Excluded until that is settled.
  note: null
