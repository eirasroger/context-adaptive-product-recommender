- category_key: facade_system
  context_key: acoustic_insulation
  theme: Site hazards
  sort_order: 3
  display_name: Noisy site
  definition_text: The day-evening-night level Lden is at least 65 dB at the most exposed facade on the strategic noise maps of the Environmental Noise Directive, typically a building fronting a main road or a railway line, or under an airport approach. The facade's margin above the minimum decides how quiet the rooms are, so sound reduction counts strongly.
