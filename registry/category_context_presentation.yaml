- category_key: indoor_partition
  context_key: seismic
  theme: Structure
  sort_order: 6
  display_name: null
  definition_text: The reference peak ground acceleration is at least 0.1 g at a 475-year return period on the 2020 European Seismic Hazard Model. Eurocode 8 sizes the force on a partition by its weight, and masonry infills and partitions were the most frequent damage in L'Aquila 2009, so a lighter partition counts moderately.
