- category_key: indoor_partition
  context_key: hot_summer
  theme: Climate
  sort_order: 7
  display_name: null
  definition_text: The mean temperature of the warmest month is at least 22 °C (Köppen subtype a, and BSk and BSh), as in most of southern Europe. A partition offers thermal mass to the rooms on both sides, which damps daytime peaks where nights are cool enough to discharge it, so internal heat capacity counts moderately.
