- category_key: facade_system
  context_key: thermal_insulation
  theme: Climate
  sort_order: 1
  display_name: Cold winter
  definition_text: The mean temperature of the coldest month is below 0 °C (Köppen group D or E), as in Scandinavia, the Baltic states, Poland, Romania and mountain areas. Heat loss through the wall is proportional to its transmittance, and over 50 years of long heating seasons it outweighs moderate differences in embodied impact, so lower U counts strongly.
