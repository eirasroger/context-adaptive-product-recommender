indicator_level:
- indicator_key: health
  level_key: h0
  level_index: 0
  display_name: Hazardous substances present
  definition_text: Contains one or more substances on the ECHA Candidate List of substances of very high concern, or restricted under REACH Annex XVII.
  normalised_position: 0.0
  is_disqualifying: 0
- indicator_key: health
  level_key: h1
  level_index: 1
  display_name: Undocumented
  definition_text: No material health assessment published. The chemistry is unknown in both directions.
  normalised_position: 0.4
  is_disqualifying: 0
- indicator_key: health
  level_key: h2
  level_index: 2
  display_name: No listed substances, uncertified
  definition_text: Screened against the ECHA Candidate List and REACH Annex XVII with nothing found, holding no Cradle to Cradle certification. Materially different from undocumented, which is why the gap to the level below is much larger than the gaps above.
  normalised_position: 0.9
  is_disqualifying: 0
- indicator_key: health
  level_key: h3
  level_index: 3
  display_name: Material Health Bronze
  definition_text: 'Cradle to Cradle Certified Version 4.0, Material Health category, Bronze achievement level: at least 75% of the product by weight assessed against the Material Health Assessment Methodology.'
  normalised_position: 0.925
  is_disqualifying: 0
- indicator_key: health
  level_key: h4
  level_index: 4
  display_name: Material Health Silver
  definition_text: 'Cradle to Cradle Certified Version 4.0, Material Health category, Silver achievement level: at least 95% of the product by weight assessed.'
  normalised_position: 0.95
  is_disqualifying: 0
- indicator_key: health
  level_key: h5
  level_index: 5
  display_name: Material Health Gold
  definition_text: 'Cradle to Cradle Certified Version 4.0, Material Health category, Gold achievement level: the whole product assessed, with every material under review found compatible with human and environmental health.'
  normalised_position: 0.975
  is_disqualifying: 0
- indicator_key: health
  level_key: h6
  level_index: 6
  display_name: Material Health Platinum
  definition_text: 'Cradle to Cradle Certified Version 4.0, Material Health category, Platinum achievement level: the whole product assessed, meeting the additional Platinum requirements on top of Gold.'
  normalised_position: 1.0
  is_disqualifying: 0
