stakeholder:
- key: balanced_optimizer
  display_name: Balanced optimizer
  definition_text: Seeks a good compromise across every indicator family and avoids extremes in any single dimension. Prefers well-rounded options with no critical weakness over options that excel narrowly.
  domain_scope_text: null
  is_active: 1
- key: circular_economy_advocate
  display_name: Circular economy advocate
  definition_text: Maximises secondary content and recovery rates and minimises landfilled and hazardous fractions. Environmental impacts matter too, but circularity dominates the trade-offs, and higher cost is acceptable when the circularity gain is substantial.
  domain_scope_text: null
  is_active: 1
- key: cost_conscious_developer
  display_name: Cost-conscious developer
  definition_text: Prioritises low total life-cycle cost. Environmental and circularity indicators remain relevant but are clearly secondary, as long as basic sustainability and performance are not extremely poor.
  domain_scope_text: null
  is_active: 1
- key: health_safety_focused
  display_name: Health and safety focused
  definition_text: Prioritises health certification and the absence of hazardous waste, and penalises unknown or non-compliant chemical profiles even when better options are only marginally more expensive. Favours properties that make installation safer.
  domain_scope_text: null
  is_active: 1
- key: occupant_comfort_focused
  display_name: Occupant comfort focused
  definition_text: Values thermal, acoustic and indoor-environmental quality, and strongly prefers better health certification. Environmental and cost indicators are important but secondary.
  domain_scope_text: null
  is_active: 1
- key: pragmatic_contractor
  display_name: Pragmatic contractor
  definition_text: 'Prefers options that reduce on-site complexity and risk: adequate workability, robust rather than borderline performance, and an acceptable environmental and cost profile. Health and the absence of hazardous waste count positively where they affect handling safety.'
  domain_scope_text: Framed around site installation and on-site risk. The archetype weakens for categories that are specified and purchased without a construction process to simplify.
  is_active: 1
- key: regulatory_aligned_builder
  display_name: Regulatory-aligned builder
  definition_text: Prefers options that align with current and expected regulatory requirements, and dislikes missing data. Penalises incomplete or unclear profiles by lowering both preference and confidence.
  domain_scope_text: null
  is_active: 1
- key: sustainability_maximalist
  display_name: Sustainability maximalist
  definition_text: Strongly minimises environmental impacts and values high secondary content and high recovery rates. Will accept somewhat higher costs when the sustainability gain is significant.
  domain_scope_text: null
  is_active: 1
