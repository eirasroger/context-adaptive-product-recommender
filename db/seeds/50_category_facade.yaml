# Facade systems, the second category. A preview: its data lives apart, in
# data/wip, built by wip/facade. Reference ranges are provisional.

provenance:
  - key: synthetic
    display_name: Synthetic, rule labelled
    definition_text: >-
      Products sampled from typology templates and scored by a declared rule
      over the registry's directions and the stakeholders' priorities. Stands in
      for language-model and expert labels while a category is being built, so
      the model can only learn what the rule already states. A category trained
      on it is shown as a preview.

indicator:
  - key: u_value
    display_name: Thermal transmittance
    family_key: performance
    value_type: continuous
    unit: W/m2K
    default_direction: -1
    definition_text: >-
      Heat flow through one square metre of the whole system per kelvin of
      temperature difference, per EN ISO 6946. Lower is better. Must meet the
      code limit for the climate zone; the margin below it still has value,
      because heating and cooling energy scale with it over the service life.

  - key: acoustic_reduction
    display_name: Airborne sound reduction
    family_key: performance
    value_type: continuous
    unit: dB
    default_direction: 1
    definition_text: >-
      Weighted airborne sound reduction index of the system, RA or Rw as
      declared or catalogued. Higher is better. A product property, distinct
      from the building's facade insulation D2m,nT,Atr, which also depends on
      windows and room geometry.

  - key: surface_mass
    display_name: Surface mass
    family_key: performance
    value_type: continuous
    unit: kg/m2
    default_direction: 0
    definition_text: >-
      Mass of one square metre of the installed system. Carries weight only: the
      acoustic and thermal-inertia benefits of mass are measured directly by the
      sound reduction and heat capacity indicators, so a direction here would
      count them twice. Context supplies the direction where load matters. Spans
      more than an order of magnitude across typologies, so it is normalised on
      a logarithmic scale.

  - key: heat_capacity
    display_name: Internal heat capacity
    family_key: performance
    value_type: continuous
    unit: kJ/m2K
    default_direction: 0
    definition_text: >-
      Internal areal heat capacity per EN ISO 13786: the thermal mass the room
      side of the system can exchange over a daily cycle. Sees where the mass
      sits, so heavy masonry behind external insulation scores high and the
      same masonry behind internal insulation scores low. Valuable where summer
      overheating is the risk; neutral elsewhere.

  - key: fire_reaction
    display_name: Reaction to fire
    family_key: health_safety
    value_type: ordinal
    default_direction: 1
    definition_text: >-
      Euroclass reaction to fire of the system per EN 13501-1, main class only.
      Higher is better. The spacing is uneven: A1 and A2 are non-combustible,
      and the step from A2 down to B is the largest on the scale. Smoke and
      droplet subclasses are left out until evidence shows decisions turn on
      them.
    levels:
      - level_key: f
        level_index: 0
        display_name: Class F
        normalised_position: 0.0
        definition_text: No performance determined.
      - level_key: e
        level_index: 1
        display_name: Class E
        normalised_position: 0.1
        definition_text: Resists a small flame for a short time.
      - level_key: d
        level_index: 2
        display_name: Class D
        normalised_position: 0.25
        definition_text: Combustible, with a limited contribution to fire.
      - level_key: c
        level_index: 3
        display_name: Class C
        normalised_position: 0.4
        definition_text: Combustible, with a limited contribution to a developing fire.
      - level_key: b
        level_index: 4
        display_name: Class B
        normalised_position: 0.55
        definition_text: Combustible, with a very limited contribution to fire.
      - level_key: a2
        level_index: 5
        display_name: Class A2
        normalised_position: 0.9
        definition_text: >-
          Non-combustible in practice, with a minor organic content. The gap to
          class B is the widest on the scale.
      - level_key: a1
        level_index: 6
        display_name: Class A1
        normalised_position: 1.0
        definition_text: Non-combustible.

  - key: thickness
    display_name: Overall thickness
    family_key: performance
    value_type: continuous
    unit: mm
    default_direction: -1
    definition_text: >-
      Overall thickness of the installed system. Lower is better, weakly in new
      build, where it costs floor area, and strongly in retrofit, where it
      projects past the building line or eats into existing rooms.

functional_unit:
  - key: m2_installed
    display_name: One square metre installed
    quantity_kind: area
    unit: m2
    reference_service_life_years: 50
    definition_text: >-
      One square metre of the complete facade system as installed, over the
      reference service life. Layered systems are aggregated to this unit
      before ingest.

category:
  - key: facade_system
    display_name: Facade system
    functional_unit_key: m2_installed
    default_context_key: new_build_mild
    definition_text: >-
      Opaque external wall systems compared per square metre installed: site
      built masonry, external thermal insulation composite systems, ventilated
      facades and sandwich panels. Typology is product metadata. The second
      category, and the first built without a published labelled dataset.
    eligibility_precondition_text: >-
      All alternatives are assumed to have passed a separate compliance check
      for the building: thermal transmittance against the climate zone limit,
      watertightness against rain exposure, facade sound insulation against the
      noise level, and reaction and resistance to fire against height and
      compartmentation. This model ranks the systems that pass; its output is
      no compliance statement.

    provenance_weights:
      control: 0.4
      synthetic: 0.6
      llm: 0.0
      expert: 0.0

    indicators:
      - {indicator_key: gwp, ref_low: 10.0, ref_high: 200.0}
      - {indicator_key: wdp, ref_low: 0.5, ref_high: 40.0}
      - {indicator_key: fwu, ref_low: 0.02, ref_high: 2.0, scale: log}
      - {indicator_key: b, ref_low: 0.0, ref_high: 1.0}

      - {indicator_key: circ_orig, ref_low: 0.0, ref_high: 100.0}
      - {indicator_key: fu_recyc, ref_low: 0.0, ref_high: 100.0}
      - {indicator_key: fu_inert, ref_low: 0.0, ref_high: 100.0}
      - {indicator_key: fu_haz, ref_low: 0.0, ref_high: 10.0}
      - indicator_key: fu_incin
        ref_low: 0.0
        ref_high: 100.0
        control_mode: exclude
        control_note: >-
          Declared neutral, as for concrete: energy recovery sits between
          material recovery and landfill, so there is no direction to sweep.

      - {indicator_key: cost_product, ref_low: 20.0, ref_high: 300.0}
      - {indicator_key: cost_labour, ref_low: 10.0, ref_high: 150.0}
      - {indicator_key: cost_maintenance, ref_low: 0.0, ref_high: 100.0}
      - indicator_key: cost_total
        ref_low: 30.0
        ref_high: 550.0
        control_mode: exclude
        control_note: >-
          Derived from the three cost components, which are swept individually.

      - {indicator_key: health}
      - {indicator_key: fire_reaction}

      - {indicator_key: u_value, ref_low: 0.15, ref_high: 1.0}
      - {indicator_key: acoustic_reduction, ref_low: 25.0, ref_high: 65.0}
      - {indicator_key: surface_mass, ref_low: 10.0, ref_high: 600.0, scale: log}
      - {indicator_key: heat_capacity, ref_low: 5.0, ref_high: 300.0, scale: log}
      - {indicator_key: thickness, ref_low: 80.0, ref_high: 600.0}

    context_overrides:
      - context_key: architectural_finish
        is_applicable: false
        justification: >-
          Its only declaration a facade holds is the reversed circular origin,
          which describes exposed concrete surfaces. Cladding appearance is a
          design choice made before the shortlist exists.

  - key: concrete
    provenance_weights:
      synthetic: 0.0

range_source_note: >-
  Provisional envelope per square metre of facade, from the CAT-EC catalogue,
  the benchmarked sandwich panel and typical EPD values. To be reset from the
  system base once real products are collected.

context:
  - key: new_build_mild
    display_name: New build, mild climate
    is_baseline: true
    definition_text: >-
      Baseline for building envelopes: new construction in a mild climate on a
      quiet site. Every alternative is assumed compliant, so thermal and
      acoustic margins matter moderately and the decision turns mostly on
      environmental impact, cost and circularity.
    declarations:
      - {indicator_key: u_value, direction: -1, priority: 0.50}
      - {indicator_key: acoustic_reduction, direction: 1, priority: 0.30}
      - {indicator_key: fire_reaction, direction: 1, priority: 0.20}
      - {indicator_key: thickness, direction: -1, priority: 0.20}

  - key: acoustic_insulation
    declarations:
      - {indicator_key: acoustic_reduction, direction: 1, priority: 0.90}

  - key: thermal_insulation
    declarations:
      - {indicator_key: u_value, direction: -1, priority: 0.90}

  - key: hot_summer
    display_name: Hot summer
    definition_text: >-
      Cooling dominates. Thermal mass on the room side of the insulation damps
      daily temperature swings, so internal heat capacity counts strongly;
      insulation still helps, less than in a cold climate.
    declarations:
      - {indicator_key: heat_capacity, direction: 1, priority: 0.80}
      - {indicator_key: u_value, direction: -1, priority: 0.50}

  - key: high_rise
    display_name: High rise
    definition_text: >-
      Tall buildings, above about 18 m. Fire risk grows with height and the
      class above the code minimum is priced by insurers, so reaction to fire
      counts strongly. Heavy systems load the structure and the fixings.
    declarations:
      - {indicator_key: fire_reaction, direction: 1, priority: 0.90}
      - {indicator_key: surface_mass, direction: -1, priority: 0.50}

  - key: retrofit
    display_name: Retrofit
    definition_text: >-
      A system added to an existing building. Lowering heat loss is the purpose;
      thickness projects past the building line or eats into rooms; the
      existing structure limits the weight it can carry.
    declarations:
      - {indicator_key: u_value, direction: -1, priority: 0.80}
      - {indicator_key: thickness, direction: -1, priority: 0.80}
      - {indicator_key: surface_mass, direction: -1, priority: 0.80}
