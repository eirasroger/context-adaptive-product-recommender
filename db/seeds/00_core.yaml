# Category-independent registry entities.
#
# Nothing here mentions a product category, and nothing here should ever need to
# when one is added.

indicator_family:
  - key: environmental_impact
    display_name: Environmental impact
    sort_order: 1
    definition_text: >-
      Life-cycle environmental burdens declared per the product's functional
      unit. Lower is better throughout this family. Members are typically drawn
      straight from an EPD's impact assessment results.

  - key: circularity
    display_name: Circularity and end of life
    sort_order: 2
    definition_text: >-
      Where the product's material came from and where it goes afterwards.
      Covers secondary content at the input side and the distribution of mass
      over end-of-life treatment routes at the output side. Direction varies by
      member: recovery routes are preferred, disposal routes are not.

  - key: cost
    display_name: Life-cycle cost
    sort_order: 3
    definition_text: >-
      Monetary cost per functional unit over the reference service life, split
      by the stage that incurs it. Lower is better throughout this family.

  - key: health_safety
    display_name: Health and safety
    sort_order: 4
    definition_text: >-
      Chemical safety, certification status and hazard exposure, for occupants
      and for the people who install and dismantle the product. Usually
      expressed on a certified ordered scale rather than as a measured quantity.

  - key: performance
    display_name: Technical performance
    sort_order: 5
    definition_text: >-
      What the product does in service: mechanical, physical and constructional
      properties. This is the family whose direction most often depends on the
      application context rather than being intrinsic, and the family where a
      newly added category is most likely to introduce indicators nothing else
      uses.

provenance:
  - key: control
    display_name: Control case
    definition_text: >-
      Deterministically generated from the registry. Every indicator is held at
      an ideal value except the one under test, whose relationship to the
      preference score is a declared function. Because the mapping is known,
      these double as the behavioural test suite.

  - key: llm
    display_name: Language-model labelled
    definition_text: >-
      Scored by a language model against a written assessment brief. Broad
      coverage of realistic trade-offs, with a self-reported confidence that is
      used to weight the loss.

  - key: expert
    display_name: Expert annotated
    definition_text: >-
      Scored by a domain practitioner. Few, slow to obtain and the closest thing
      available to ground truth, so they carry the highest weight per example
      and are never averaged together at ingest time.
