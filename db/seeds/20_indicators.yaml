# Indicators, shared across categories. A default_direction of 0 leaves direction to context.

indicator:
  # Environmental impact
  - key: gwp
    display_name: Global warming potential
    family_key: environmental_impact
    value_type: continuous
    unit: kg CO2-eq per functional unit
    default_direction: -1
    definition_text: >-
      Greenhouse gas emissions expressed as carbon dioxide equivalent over the
      declared life-cycle stages. The headline environmental figure on almost
      every EPD and the indicator most often driving a sustainability-led
      decision. Lower is better.

  - key: wdp
    display_name: Water deprivation potential
    family_key: environmental_impact
    value_type: continuous
    unit: m3-eq per functional unit
    default_direction: -1
    definition_text: >-
      Water consumption weighted by local scarcity, so the same volume counts
      for more where water is scarce. Lower is better.

  - key: fwu
    display_name: Freshwater use
    family_key: environmental_impact
    value_type: continuous
    unit: m3 per functional unit
    default_direction: -1
    definition_text: >-
      Unweighted freshwater consumed over the declared life-cycle stages.
      Reported alongside the scarcity-weighted figure because the two diverge
      for products made in water-rich regions. Lower is better. Values commonly
      span more than one order of magnitude, so this indicator is normalised on
      a logarithmic scale.

  - key: b
    display_name: Biodiversity pressure
    family_key: environmental_impact
    value_type: continuous
    default_direction: -1
    definition_text: >-
      Composite score on a nought-to-one scale aggregating eutrophication,
      acidification, abiotic resource depletion and ecosystem-related climate
      impacts. Lower indicates lower pressure on ecosystems. Being an aggregate,
      it is less diagnostic than its components but is frequently the only
      ecosystem figure available.

  # Circularity
  - key: circ_orig
    display_name: Circular origin
    family_key: circularity
    value_type: continuous
    unit: "%"
    default_direction: 1
    definition_text: >-
      Share of the product's mass coming from secondary or non-virgin sources.
      Higher means more substitution of primary raw materials, so higher is
      better in general. Note that a high value can work against appearance
      quality where the product's surface is the finished surface, which is a
      context-specific effect rather than a property of the indicator.

  - key: fu_recyc
    display_name: Recovered at end of life
    family_key: circularity
    value_type: continuous
    unit: "%"
    default_direction: 1
    definition_text: >-
      Share of mass reused, reconditioned, recycled or materially valorised at
      end of life. Higher is better. One of four end-of-life route shares that
      together should approximately account for the whole mass.

  - key: fu_incin
    display_name: Incinerated with energy recovery
    family_key: circularity
    value_type: continuous
    unit: "%"
    default_direction: 0
    definition_text: >-
      Share of mass incinerated with energy recovery at end of life. Treated as
      broadly neutral: better than inert landfill, worse than material recovery.
      The neutral direction is declared deliberately, not left undeclared.

  - key: fu_inert
    display_name: Inert landfill
    family_key: circularity
    value_type: continuous
    unit: "%"
    default_direction: -1
    definition_text: >-
      Share of mass ending in inert landfill at end of life. Lower is better.

  - key: fu_haz
    display_name: Hazardous waste disposal
    family_key: circularity
    value_type: continuous
    unit: "%"
    default_direction: -1
    definition_text: >-
      Share of mass disposed of as hazardous waste at end of life. Much lower is
      strongly better and the ideal is nought. Carries more weight per unit than
      the other end-of-life routes because it implies a handling and liability
      burden rather than merely a lost material.

  # Cost
  - key: cost_product
    display_name: Product cost
    family_key: cost
    value_type: continuous
    unit: currency per functional unit
    default_direction: -1
    definition_text: >-
      Purchase cost of the product itself, excluding installation and
      maintenance. Lower is better.

  - key: cost_labour
    display_name: Workforce cost
    family_key: cost
    value_type: continuous
    unit: currency per functional unit
    default_direction: -1
    definition_text: >-
      Installation, handling and end-of-life removal cost. Lower is better.
      Separated from purchase cost because a cheaper product that is slower to
      install is a different proposition from one that is simply expensive.

  - key: cost_maintenance
    display_name: Maintenance cost
    family_key: cost
    value_type: continuous
    unit: currency per functional unit
    default_direction: -1
    definition_text: >-
      Maintenance and repair cost accrued over the reference service life.
      Lower is better. Sensitive to the declared service life, so it is only
      comparable within one functional unit.

  - key: cost_total
    display_name: Total life-cycle cost
    family_key: cost
    value_type: continuous
    unit: currency per functional unit
    default_direction: -1
    is_derived: true
    derivation:
      cost_product: 1.0
      cost_labour: 1.0
      cost_maintenance: 1.0
    definition_text: >-
      Sum of product, workforce and maintenance cost. Derived rather than
      authored, and carried alongside its components rather than replacing them,
      so that a decision-maker who cares specifically about maintenance can be
      distinguished from one who only cares about the total.

  # Health and safety
  - key: health
    display_name: Product health score
    family_key: health_safety
    value_type: ordinal
    default_direction: 1
    definition_text: >-
      Material health status on an ordered scale running from hazardous
      substances present, through undocumented and screened-but-uncertified, to
      the four Cradle to Cradle Certified Material Health achievement levels.
      Higher is better. The scale is unevenly spaced: the step from an
      unassessed product to a screened one is a different kind of step from one
      certification tier to the next, which is why the level positions are
      declared individually rather than assumed uniform. The scale records what
      has been assessed and published about a product's chemistry. It carries no
      statement about legal compliance, which the category's eligibility
      precondition places outside this model.
    levels:
      - level_key: h0
        level_index: 0
        display_name: Hazardous substances present
        normalised_position: 0.0
        definition_text: >-
          Contains one or more substances on the ECHA Candidate List of
          substances of very high concern, or restricted under REACH Annex XVII.
      - level_key: h1
        level_index: 1
        display_name: Undocumented
        normalised_position: 0.4
        definition_text: >-
          No material health assessment published. The chemistry is unknown in
          both directions.
      - level_key: h2
        level_index: 2
        display_name: No listed substances, uncertified
        normalised_position: 0.9
        definition_text: >-
          Screened against the ECHA Candidate List and REACH Annex XVII with
          nothing found, holding no Cradle to Cradle certification. Materially
          different from undocumented, which is why the gap to the level below
          is much larger than the gaps above.
      - level_key: h3
        level_index: 3
        display_name: Material Health Bronze
        normalised_position: 0.925
        definition_text: >-
          Cradle to Cradle Certified Version 4.0, Material Health category,
          Bronze achievement level: at least 75% of the product by weight
          assessed against the Material Health Assessment Methodology.
      - level_key: h4
        level_index: 4
        display_name: Material Health Silver
        normalised_position: 0.95
        definition_text: >-
          Cradle to Cradle Certified Version 4.0, Material Health category,
          Silver achievement level: at least 95% of the product by weight
          assessed.
      - level_key: h5
        level_index: 5
        display_name: Material Health Gold
        normalised_position: 0.975
        definition_text: >-
          Cradle to Cradle Certified Version 4.0, Material Health category, Gold
          achievement level: the whole product assessed, with every material
          under review found compatible with human and environmental health.
      - level_key: h6
        level_index: 6
        display_name: Material Health Platinum
        normalised_position: 1.0
        definition_text: >-
          Cradle to Cradle Certified Version 4.0, Material Health category,
          Platinum achievement level: the whole product assessed, meeting the
          additional Platinum requirements on top of Gold.

  # Technical performance
  - key: compressive_strength
    display_name: Compressive strength
    family_key: performance
    value_type: continuous
    unit: MPa
    default_direction: 1
    definition_text: >-
      Characteristic compressive strength class. Higher is generally better, but
      returns diminish sharply once the structural requirement is met, since all
      alternatives reaching the comparison are assumed already adequate.

  - key: water_to_cement_ratio
    display_name: Water to cement ratio
    family_key: performance
    value_type: continuous
    default_direction: -1
    definition_text: >-
      Mass ratio of water to cementitious content. Lower generally means lower
      permeability and better durability, and is preferred where other factors
      are equal.

  - key: cement_content
    display_name: Cementitious content
    family_key: performance
    value_type: continuous
    unit: kg per m3
    default_direction: -1
    definition_text: >-
      Total cementitious content of the mix. Higher content can support strength
      and durability but typically raises both environmental impact and cost
      through clinker. The declared direction reflects the impact and cost side,
      which dominates once structural adequacy is assumed; supplementary
      cementitious content can offset the impact for a given total.

  - key: scm_content
    display_name: Supplementary cementitious content
    family_key: performance
    value_type: continuous
    unit: kg per m3
    default_direction: 1
    definition_text: >-
      Portion of the cementitious content made up of supplementary materials
      such as slag or fly ash. Higher generally improves circularity and lowers
      environmental impact per unit of strength, assuming performance stays
      adequate.

  - key: slump
    display_name: Workability
    family_key: performance
    value_type: continuous
    unit: mm
    default_direction: 1
    definition_text: >-
      Consistency measure standing in for workability. Higher generally means
      easier placing and compaction and a better surface result. Very high
      values can be unnecessary where the application does not call for them,
      so this indicator is a candidate for an ideal-band declaration if the
      labelled evidence supports one; it is currently declared monotone.

  - key: density
    display_name: Density
    family_key: performance
    value_type: continuous
    unit: kg per m3
    default_direction: 0
    definition_text: >-
      Hardened density. Direction is supplied entirely by context and is
      genuinely opposed between contexts: higher density improves sound
      insulation while lower density improves thermal insulation and reduces
      self-weight. Declaring no default direction is the point -- this is the
      clearest case in the corpus of an indicator whose meaning inverts with the
      application.

  - key: d_max
    display_name: Maximum aggregate size
    family_key: performance
    value_type: continuous
    unit: mm
    default_direction: 0
    definition_text: >-
      Largest nominal aggregate size in the mix. Structurally acceptable over a
      wide range, so it carries no intrinsic direction; smaller sizes favour
      smooth uniform surfaces and some workability aspects, which makes this
      indicator meaningful only where the surface is part of the deliverable.
