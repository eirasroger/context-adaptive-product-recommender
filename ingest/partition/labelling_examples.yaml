         heat_capacity: 110.0, fire_reaction: "Class A2", thickness: 194.0, acoustic_reduction_pink: 51.8, impact_resistance: "Category III"}
    labels:
      - {id_prod: A, pref: 0.35, conf: 0.8, reason: "By far the cheapest at 54 in total, but 38.9 dBA is weak against a room above 70 dB(A); the saving does not make up for the noise next door."}
      - {id_prod: B, pref: 0.65, conf: 0.7, reason: "The quietest at 61.6 dBA, ten decibels better than C, but at 198 in total it costs about 75% more, which a cost-conscious developer weighs heavily."}
      - {id_prod: C, pref: 0.75, conf: 0.7, reason: "51.8 dBA gives a solid margin against the noisy room at a total of 114, the best balance of sound and cost here; health is undocumented, as for B."}

