# Worked examples for the partition labelling brief. Values are composed partitions from
# data/partition/products.json; the judgements are written by hand.

examples:
  - applications: [Next to a noisy room]
    stakeholders: [Cost-conscious developer]
    alternatives:
      - {id_prod: A, gwp: 18.4, wdp: 13.8, fwu: 0.349, circ_orig: 48.4, fu_recyc: 23.7, fu_incin: 0.0, fu_inert: 76.3, fu_haz: 0.0115,
         cost_product: 23.7, cost_labour: 23.5, cost_maintenance: 6.48, health: null, u_value: 1.54, surface_mass: 47.2,
         heat_capacity: 21.4, fire_reaction: "Class A2", thickness: 130.0, acoustic_reduction_pink: 38.9, impact_resistance: "Category IV"}
      - {id_prod: B, gwp: 68.1, wdp: 20.0, fwu: 0.293, circ_orig: 3.95, fu_recyc: 20.1, fu_incin: 0.0, fu_inert: 79.8, fu_haz: 0.0119,
         cost_product: 88.7, cost_labour: 61.5, cost_maintenance: 47.5, health: "Undocumented", u_value: 0.473, surface_mass: 257.0,
         heat_capacity: 68.0, fire_reaction: "Class A1", thickness: 250.0, acoustic_reduction_pink: 61.6, impact_resistance: "Category III"}
      - {id_prod: C, gwp: 40.3, wdp: 15.6, fwu: 0.152, circ_orig: 6.85, fu_recyc: 68.4, fu_incin: 0.0, fu_inert: 31.6, fu_haz: 0.0019,
