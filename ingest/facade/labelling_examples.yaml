# Worked examples for the facade labelling brief. Values are real corpus products;
# the judgements are written by hand. Keys follow the brief's indicator list.

examples:
  - applications: [Retrofit]
    stakeholders: [Cost-conscious developer]
    alternatives:
      - {id_prod: A, gwp: 21.6, wdp: 49.5, fwu: null, circ_orig: 0.06, fu_recyc: 98.2, fu_incin: 0.0, fu_inert: 1.8, fu_haz: 0.01,
         cost_product: 83.1, cost_labour: 72.8, cost_maintenance: 47.8, health: "Undocumented", u_value: 0.21,
         acoustic_reduction: 54.9, surface_mass: 313, heat_capacity: 197, fire_reaction: "Class A2", thickness: 366}
      - {id_prod: B, gwp: 52.0, wdp: 8.95, fwu: null, circ_orig: 0.12, fu_recyc: 88.6, fu_incin: 0.0, fu_inert: 11.4, fu_haz: 0.01,
         cost_product: 95.2, cost_labour: 72.6, cost_maintenance: 46.8, health: "No listed substances, uncertified", u_value: 0.20,
         acoustic_reduction: 44.1, surface_mass: 252, heat_capacity: 148, fire_reaction: "Class C", thickness: 317}
      - {id_prod: C, gwp: 47.9, wdp: null, fwu: null, circ_orig: null, fu_recyc: 66.6, fu_incin: 0.0, fu_inert: 33.4, fu_haz: 0.0,
         cost_product: 120.8, cost_labour: 60.5, cost_maintenance: 34.1, health: "Undocumented", u_value: 0.17,
         acoustic_reduction: 46.3, surface_mass: 248, heat_capacity: 147, fire_reaction: "Class B", thickness: 343}
    labels:
      - {id_prod: A, pref: 0.62, conf: 0.7, reason: "Lowest total cost (204 against 215) and the lowest GWP, but the heaviest and thickest option, which weighs against it in a retrofit where added load and projection matter."}
      - {id_prod: B, pref: 0.78, conf: 0.7, reason: "Thinnest and among the lightest, with a good U-value at a total cost within 5% of the cheapest; the best retrofit fit for a cost-led developer despite higher GWP."}
      - {id_prod: C, pref: 0.74, conf: 0.6, reason: "Best U-value and lightest, which serves the retrofit's purpose, at the same total cost as B; several environmental values are unknown, so confidence is lower."}

