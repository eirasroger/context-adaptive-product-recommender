         acoustic_reduction: 51.6, surface_mass: 480, heat_capacity: 158, fire_reaction: "Class A1", thickness: 313}
    labels:
      - {id_prod: A, pref: 0.35, conf: 0.8, reason: "Lowest GWP and the only certified health profile, but a sound reduction of 33 dB is far below the others on a noisy site, and all of it ends in landfill."}
      - {id_prod: B, pref: 0.50, conf: 0.75, reason: "Good sound reduction, but the highest GWP, 80% landfilled at end of life and the weakest U-value, which a comfort-focused and sustainability-led pair both mark down."}
