# Baseline training configuration.
name: baseline
db: data/corpus.db
split_key: default
device: auto
output_dir: runs

arch:
  dim: 96
  encoder_heads: 4
  encoder_blocks: 2
  comparator_heads: 4
  comparator_blocks: 2
  dropout: 0.1
  use_family_prior: true
  use_context_residual: true

optim:
  learning_rate: 0.0006
  weight_decay: 0.01
  batch_size: 256
  epochs: 30
  warmup_steps: 300
  patience: 6

loss:
  pointwise: 1.0
  pairwise: 1.0
  listwise: 0.0

notes: Baseline with control coverage for every sweepable indicator.
