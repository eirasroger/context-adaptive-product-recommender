# Facade context selection: the long list, the screening and the prevalence evidence.
#
# A context earns a registry row when it passes three tests and then scores
# high enough on prevalence and influence (measured by
# experiments.context_influence):
#   ranking     it changes preference among options that already pass the code,
#               including a valued margin above the minimum
#   preference  it changes how much an indicator matters, leaving the product's
#               values as they are
#   external    it describes the project's situation, never a decision-maker's priority
#
# Prevalence is the share of European facade decisions the context applies to,
# in bands: high > 30 %, medium 10 to 30 %, low 3 to 10 %, rare < 3 %.
# A band marked `judgement` has no statistical source and needs expert review.

baseline:
  name: Baseline
  description: >-
    A new residential building of four to six storeys in a temperate climate,
    neither heating- nor cooling-dominated, on a quiet site, outside wildfire
    and seismic areas, in a country without a legal limit on embodied carbon.
    The facade goes on a new structure designed for it, with no constraint on
    its thickness.

sources:
  F08: Galdeano, INIREC F08 v2.0, contexts C01 to C24 (2026-10-21)
  CTE: Codigo Tecnico de la Edificacion, conditions that trigger DB HE, HR, SI, HS, SE, SUA
  LEVELS: JRC Level(s) user manual 2 and indicators 2.3, 2.4
  EPBD: Directive (EU) 2024/1275, renovation and life-cycle GWP articles
  ADDED: candidate added in this review

candidates:
  # Climate and environment
  - key: cold_winter
    name: Cold winter
    source: [F08 C01, CTE HE]
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: pilot
    prevalence: {band: medium, basis: "Koppen D and E (coldest month below 0 C) cover roughly a quarter of the EU population, from national populations of the countries mostly inside them; judgement"}
    description: >-
      The building is in a heating-dominated climate with long, cold winters,
      as in central and northern Europe or Spanish winter zones D and E.
      Heating runs for most of the year.

  - key: hot_summer
    name: Hot summer
    source: [F08 C02, CTE HE]
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: pilot
    prevalence: {band: medium, basis: "Cooling degree days concentrated in the Mediterranean member states, about 28 % of EU population, and nearly tripled since 1979 (Eurostat)"}
    description: >-
      The building is in a cooling-dominated climate with long, hot summers and
      warm nights, as in southern Europe or Spanish summer zone 4. Overheating
      is the main comfort problem; winters are mild.

  - key: driving_rain
    name: Driving rain exposure
    source: [F08 C03, CTE HS 1]
    tests: {ranking: no, preference: no, external: yes}
    outcome: compliance
    reason: >-
      Sets a watertightness grade to pass; a grade above it carries little
      value. Its effect on durability shows in the maintenance cost value.

  - key: wind_exposure
    name: Wind exposure and facade edges
    source: [F08 C04, CTE SE-AE]
    tests: {ranking: no, preference: no, external: yes}
    outcome: compliance
    reason: >-
      Resistance and deformation must meet the design action; surplus is not
      sought (Galdeano, final study case 5). No indicator in the data.

  - key: aggressive_exposure
    name: Coastal, saline or frost exposure
    source: [F08 C05]
    tests: {ranking: yes, preference: no, external: yes}
    outcome: value
    reason: >-
      Changes the product's maintenance cost and service life, both already
      inside cost_maintenance over the 50-year unit. Raising their weight would
      count the effect twice.

  - key: noisy
    name: Noisy site
    source: [F08 C06, CTE HR]
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: pilot
    prevalence: {band: low to medium, basis: "Over 20 % of Europeans above Lden 55 dB, road traffic alone 92 million (EEA, Environmental noise in Europe 2025); the context starts at 65 dB, so fewer; judgement"}
    description: >-
      The building faces a major road or railway, with daytime noise around 65
      to 70 dB(A) at the facade. The rooms behind it are bedrooms and living
      rooms.

  - key: indoor_humidity
    name: High indoor humidity
    source: [F08 C08, CTE HE 1 3.3]
    tests: {ranking: no, preference: yes, external: yes}
    outcome: compliance
    reason: A condensation check to pass. No vapour indicator in the data.

  - key: wildfire
    name: Wildfire-prone edge of town
    source: [ADDED]
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: pilot
    prevalence: {band: low, basis: "Wildland-urban interface covers 7.4 % (Bar-Massada et al. 2023) to 15 % (Schug et al. 2023) of Europe's land, concentrated in the Mediterranean; population share judgement"}
    description: >-
      The building stands at the edge of a town, next to forest or scrubland,
      in a region with frequent summer wildfires.

  - key: seismic
    name: Seismic zone
    source: [ADDED]
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: pilot
    prevalence: {band: high, basis: "Almost 35 % of Europe's residential population exposed to PGA of at least 0.1 g at 475 years (ESRM20 exposure model, preliminary); highest in Italy, Greece, Romania, Balkans"}
    description: >-
      The building is in a zone of moderate to high seismic hazard, as in
      southern Italy, Greece or south-east Spain; the structure is designed for
      earthquake loading.

  # Use and occupancy
  - key: office
    name: Office building
    source: [F08 C07, CTE HE and HR by use]
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: pilot
    prevalence: {band: low, basis: "Non-residential about a quarter of EU floor area, offices 23 % of it (BPIE 2012; RICS)"}
    description: >-
      The building is an office building, occupied in the daytime on working
      days, with high internal heat gains from people and equipment.

  - key: school_healthcare
    name: School or healthcare building
    source: [F08 C07, CTE HR protected rooms]
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: pilot
    prevalence: {band: low, basis: "Education 17 % and hospitals 7 to 11 % of EU non-residential floor area (BPIE 2012; RICS)"}
    description: >-
      The building is a school or a healthcare building, occupied by children
      or patients, some of them vulnerable.

  # Height, fire and structure
  - key: high_rise
    name: High-rise
    source: [F08 C09, CTE SI 2]
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: pilot
    prevalence: {band: medium, basis: "23.8 % of EU population lives in buildings of ten or more dwellings (Eurostat 2016), an upper proxy for buildings over 18 m; judgement"}
    description: >-
      The building is tall: about fifteen storeys, roughly 45 m.

  - key: fire_separation
    name: Fire separation and nearby buildings
    source: [F08 C10, CTE SI 2]
    tests: {ranking: no, preference: yes, external: yes}
    outcome: compliance
    reason: Triggers EI strips at sector and building boundaries; local thresholds.

  - key: public_access_base
    name: Publicly accessible facade base
    source: [F08 C11, CTE SI 2 1.6, SUA]
    tests: {ranking: no, preference: yes, external: yes}
    outcome: compliance
    reason: A fire class and impact check for the lowest 3.5 m only.

  - key: load_bearing
    name: Load-bearing facade
    source: [F08 C12, CTE SE]
    tests: {ranking: no, preference: no, external: yes}
    outcome: compliance
    reason: Decides which systems are eligible at all (no sandwich panel or ETICS carries load).

  # Project and intervention
  - key: fixed_geometry
    name: Fixed geometry and openings
    source: [F08 C13]
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: scope
    reason: Acts through windows and whole-envelope loss, outside one square metre of opaque wall.

  - key: retrofit
    name: External retrofit
    source: [F08 C14, EPBD renovation]
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: scope
    piloted: true
    reason: >-
      The piloted products are complete new walls, which do not exist in a
      retrofit that keeps the wall, so the pilot result is unreliable.
      Retested in the candidate retrofit overcladding category.
    prevalence: {band: high, basis: "Renovation is the largest residential construction segment and held up while new build fell, 2023 to 2025 (Euroconstruct; ING); EPBD renovation trajectory"}
    description: >-
      The facade system is added to an existing 1970s residential building with
      uninsulated walls. The existing wall stays and the new system goes on its
      outer face.

  - key: limited_support
    name: Limited support capacity
    source: [F08 C15, Galdeano final study case 3]
    parent: retrofit
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: scope
    piloted: true
    reason: >-
      Arises only when an add-on system goes on an existing wall, a different
      functional unit from a complete new wall. A context of the candidate
      retrofit overcladding category (docs/CONTEXTS.md 5.2).
    prevalence: {band: low, basis: "A subset of retrofits; judgement"}
    description: >-
      The facade system is added to an existing building whose structure and
      walls have limited capacity: the engineer has documented that the added
      dead load must be kept low.

  - key: tight_thickness
    name: No room to grow outwards
    source: [F08 C16]
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: pilot
    prevalence: {band: low, basis: "Internal insulation is a niche, mainly for protected facades; boundary-line plots are common in dense centres; judgement"}
    description: >-
      The building sits on the street line or the plot boundary, so the facade
      cannot grow outwards; any added thickness is taken from the rooms.

  - key: occupied_works
    name: Renovation of an occupied building
    source: [F08 C17, ADDED]
    parent: retrofit
    tests: {ranking: yes, preference: yes, external: yes}
    outcome: pilot
    decision: drop
    reason: Influence interval spans zero against the baseline.
    prevalence: {band: medium, basis: "Multi-owner residential retrofits are usually carried out with residents in place; judgement"}
    description: >-
      An existing residential building is renovated while its residents keep
      living in it; the facade works happen around them for their whole
      duration.

  - key: heritage
    name: Protected facade
    source: [ADDED, CTE application rules]
    tests: {ranking: no, preference: no, external: yes}
    outcome: compliance
    reason: Restricts which systems are allowed; where insulation goes inside, tight_thickness covers it.

  - key: construction_site
    name: Constrained site or short programme
    source: [F08 C17]
    tests: {ranking: yes, preference: yes, external: no}
    outcome: stakeholder
    reason: Carried by the pragmatic contractor archetype.

  - key: remote_site
    name: Remote site
    source: [ADDED]
    tests: {ranking: yes, preference: no, external: yes}
    outcome: value
    reason: Raises transport impact (A4) and cost, which are values of the product on that site.

  - key: urban_pollution
    name: Polluted urban air
    source: [ADDED]
    tests: {ranking: yes, preference: no, external: yes}
    outcome: value
    reason: Soiling raises cleaning cost, a value inside cost_maintenance.

  # Life cycle and decision
  - key: maintenance_access
    name: Difficult maintenance access
    source: [F08 C18]
    tests: {ranking: yes, preference: no, external: yes}
    outcome: value
    reason: Raises the cost of each intervention, a value inside cost_maintenance.

  - key: service_horizon
    name: Service horizon
    source: [F08 C19, LEVELS]
    tests: {ranking: yes, preference: no, external: yes}
    outcome: scope
    reason: Fixed by the functional unit (50 years); a different horizon is a different unit.

  - key: future_change
    name: Expected future change of use
    source: [F08 C20, LEVELS 2.3]
    tests: {ranking: yes, preference: yes, external: no}
    outcome: stakeholder
    reason: A design ambition carried by the circular economy advocate; no adaptability indicator.

  - key: recovery_chain
    name: Recovery infrastructure
    source: [F08 C21, LEVELS 2.4]
    tests: {ranking: yes, preference: no, external: yes}
    outcome: value
    reason: Decides whether declared end-of-life shares come true, a property of the values.

  - key: client_priorities
    name: Client objectives
    source: [F08 C22]
    tests: {ranking: yes, preference: yes, external: no}
    outcome: stakeholder
    reason: The stakeholder archetypes.

  - key: evidence
    name: Available evidence
    source: [F08 C23]
    tests: {ranking: yes, preference: no, external: yes}
    outcome: value
    reason: Handled by missing values and the labeller's confidence.

  - key: boundary
    name: Scale and assessment boundary
    source: [F08 C24]
    tests: {ranking: no, preference: no, external: yes}
    outcome: scope
    reason: Fixed by the category and its functional unit.

  - key: carbon_regulated
    name: Embodied-carbon limit in force
    source: [ADDED, EPBD life-cycle GWP]
    tests: {ranking: yes, preference: yes, external: no}
    outcome: stakeholder
    piloted: true
    reason: >-
      A limit on the whole building, so either a threshold for compliance or a
      priority the decision-maker brings; the regulatory-aligned builder
      carries it. Piloted before this was caught; its measured effect is a
      stakeholder effect.
    prevalence: {band: medium, basis: "Limits in force in France, Denmark and the Netherlands; EPBD requires every member state's GWP roadmap by 2027 and disclosure for all new buildings from 2030"}
    description: >-
      The project is in a country with a legal limit on the whole building's
      life-cycle embodied carbon per square metre, which the building as a
      whole must meet.
